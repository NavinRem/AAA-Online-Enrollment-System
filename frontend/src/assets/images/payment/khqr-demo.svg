<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#ffffff" rx="16"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="280" height="280" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top-left Finder Pattern -->
  <rect x="30" y="30" width="60" height="60" rx="8" fill="#1e293b"/>
  <rect x="40" y="40" width="40" height="40" rx="4" fill="#ffffff"/>
  <rect x="48" y="48" width="24" height="24" rx="2" fill="#e11d48"/>

  <!-- Top-right Finder Pattern -->
  <rect x="210" y="30" width="60" height="60" rx="8" fill="#1e293b"/>
  <rect x="220" y="40" width="40" height="40" rx="4" fill="#ffffff"/>
  <rect x="228" y="48" width="24" height="24" rx="2" fill="#e11d48"/>

  <!-- Bottom-left Finder Pattern -->
  <rect x="30" y="210" width="60" height="60" rx="8" fill="#1e293b"/>
  <rect x="40" y="220" width="40" height="40" rx="4" fill="#ffffff"/>
  <rect x="48" y="228" width="24" height="24" rx="2" fill="#e11d48"/>

  <!-- Simulated QR Data Blocks (Decorative pixel matrix) -->
  <g fill="#1e293b">
    <rect x="105" y="30" width="12" height="12" rx="2"/><rect x="135" y="30" width="12" height="12" rx="2"/><rect x="165" y="30" width="12" height="12" rx="2"/><rect x="180" y="30" width="12" height="12" rx="2"/>
    <rect x="105" y="45" width="12" height="12" rx="2"/><rect x="120" y="45" width="12" height="12" rx="2"/><rect x="150" y="45" width="12" height="12" rx="2"/><rect x="180" y="45" width="12" height="12" rx="2"/>
    <rect x="120" y="60" width="12" height="12" rx="2"/><rect x="135" y="60" width="12" height="12" rx="2"/><rect x="165" y="60" width="12" height="12" rx="2"/>
    <rect x="105" y="75" width="12" height="12" rx="2"/><rect x="150" y="75" width="12" height="12" rx="2"/><rect x="180" y="75" width="12" height="12" rx="2"/>
    
    <rect x="30" y="105" width="12" height="12" rx="2"/><rect x="60" y="105" width="12" height="12" rx="2"/><rect x="75" y="105" width="12" height="12" rx="2"/><rect x="105" y="105" width="12" height="12" rx="2"/><rect x="180" y="105" width="12" height="12" rx="2"/><rect x="210" y="105" width="12" height="12" rx="2"/><rect x="240" y="105" width="12" height="12" rx="2"/><rect x="255" y="105" width="12" height="12" rx="2"/>
    <rect x="45" y="120" width="12" height="12" rx="2"/><rect x="75" y="120" width="12" height="12" rx="2"/><rect x="105" y="120" width="12" height="12" rx="2"/><rect x="180" y="120" width="12" height="12" rx="2"/><rect x="225" y="120" width="12" height="12" rx="2"/><rect x="255" y="120" width="12" height="12" rx="2"/>
    <rect x="30" y="135" width="12" height="12" rx="2"/><rect x="60" y="135" width="12" height="12" rx="2"/><rect x="210" y="135" width="12" height="12" rx="2"/><rect x="240" y="135" width="12" height="12" rx="2"/>
    
    <rect x="30" y="165" width="12" height="12" rx="2"/><rect x="45" y="165" width="12" height="12" rx="2"/><rect x="75" y="165" width="12" height="12" rx="2"/><rect x="105" y="165" width="12" height="12" rx="2"/><rect x="180" y="165" width="12" height="12" rx="2"/><rect x="210" y="165" width="12" height="12" rx="2"/><rect x="225" y="165" width="12" height="12" rx="2"/><rect x="255" y="165" width="12" height="12" rx="2"/>
    <rect x="60" y="180" width="12" height="12" rx="2"/><rect x="75" y="180" width="12" height="12" rx="2"/><rect x="105" y="180" width="12" height="12" rx="2"/><rect x="180" y="180" width="12" height="12" rx="2"/><rect x="210" y="180" width="12" height="12" rx="2"/><rect x="240" y="180" width="12" height="12" rx="2"/><rect x="255" y="180" width="12" height="12" rx="2"/>
    
    <rect x="105" y="210" width="12" height="12" rx="2"/><rect x="135" y="210" width="12" height="12" rx="2"/><rect x="165" y="210" width="12" height="12" rx="2"/><rect x="180" y="210" width="12" height="12" rx="2"/><rect x="210" y="210" width="12" height="12" rx="2"/><rect x="240" y="210" width="12" height="12" rx="2"/><rect x="255" y="210" width="12" height="12" rx="2"/>
    <rect x="120" y="225" width="12" height="12" rx="2"/><rect x="150" y="225" width="12" height="12" rx="2"/><rect x="180" y="225" width="12" height="12" rx="2"/><rect x="210" y="225" width="12" height="12" rx="2"/><rect x="255" y="225" width="12" height="12" rx="2"/>
    <rect x="105" y="240" width="12" height="12" rx="2"/><rect x="135" y="240" width="12" height="12" rx="2"/><rect x="165" y="240" width="12" height="12" rx="2"/><rect x="225" y="240" width="12" height="12" rx="2"/><rect x="240" y="240" width="12" height="12" rx="2"/>
    <rect x="120" y="255" width="12" height="12" rx="2"/><rect x="150" y="255" width="12" height="12" rx="2"/><rect x="180" y="255" width="12" height="12" rx="2"/><rect x="210" y="255" width="12" height="12" rx="2"/><rect x="240" y="255" width="12" height="12" rx="2"/><rect x="255" y="255" width="12" height="12" rx="2"/>
  </g>

  <!-- Bakong Center Logo in red circle -->
  <g transform="translate(120, 120)">
    <circle cx="30" cy="30" r="28" fill="#ffffff" stroke="#e11d48" stroke-width="3"/>
    <circle cx="30" cy="30" r="22" fill="#e11d48"/>
    <!-- KH Text / Symbol -->
    <text x="30" y="36" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">KH</text>
  </g>
</svg>
